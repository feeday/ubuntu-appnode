[unix_http_server]
file=/run/ubuntu-node-supervisor.sock
chmod=0600
chown=root:root

[supervisord]
user=root
pidfile=/run/ubuntu-node-supervisor.pid
logfile=/var/log/ubuntu-node-supervisor.log
logfile_maxbytes=5MB
logfile_backups=2
childlogdir=/var/log

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/ubuntu-node-supervisor.sock

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=root
autostart=true
autorestart=unexpected
stopsignal=QUIT
stopwaitsecs=15
stdout_logfile=/var/log/ubuntu-node-nginx.log
stderr_logfile=/var/log/ubuntu-node-nginx-error.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile_backups=2

[program:panel]
command=/usr/bin/gunicorn --bind 127.0.0.1:8888 --workers 1 --threads 4 --timeout 90 --access-logfile - --error-logfile - panel.wsgi:app
directory=/opt/ubuntu-node
user=ubuntu-node
environment=PYTHONDONTWRITEBYTECODE="1",UBUNTU_NODE_STATE="/var/lib/ubuntu-node"
umask=0077
autostart=true
autorestart=unexpected
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/ubuntu-node-panel.log
stderr_logfile=/var/log/ubuntu-node-panel-error.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile_backups=2

[program:firewall-restore]
command=/usr/local/libexec/ubuntu-node-firewall-restore
user=root
autostart=true
autorestart=false
startsecs=0
startretries=0
stdout_logfile=/var/log/ubuntu-node-firewall.log
stderr_logfile=/var/log/ubuntu-node-firewall-error.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB
